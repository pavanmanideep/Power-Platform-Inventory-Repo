##############################################################################
# Daily Power Platform Inventory Report
#
# MULTI-TENANT SETUP
# ─────────────────────────────────────────────────────────────────────────────
# This workflow uses GitHub Environments to support multiple tenants.
# Each tenant gets its own GitHub Environment (Settings → Environments) with
# its own set of secrets. To add a new tenant:
#
#   1. Go to Settings → Environments → New environment
#      Name it something recognisable, e.g. "contoso" or "fabrikam"
#
#   2. Add the following secrets to that environment:
#      AZURE_CREDENTIALS  — Service principal JSON:
#                           { "clientId":"...", "clientSecret":"...",
#                             "subscriptionId":"...", "tenantId":"..." }
#      PP_CLIENT_ID       — App registration clientId for pac CLI
#      PP_CLIENT_SECRET   — App registration client secret
#      PP_TENANT_ID       — AAD Tenant GUID
#      PP_TENANT_DOMAIN   — e.g. contoso.onmicrosoft.com
#
#   3. To run the report for that tenant:
#      Actions → "Daily Power Platform Inventory Report" → Run workflow
#      → set target_environment to the environment name (e.g. "contoso")
#
#   4. The schedule always uses the default "production" environment.
#      Change the default below or add additional scheduled jobs per tenant.
##############################################################################

name: Daily Power Platform Inventory Report

on:
  schedule:
    - cron: '0 6 * * *'   # Every day at 06:00 UTC
  workflow_dispatch:
    inputs:
      target_environment:
        description: |
          GitHub Environment to use (maps to a set of tenant-specific secrets).
          Create one GitHub Environment per tenant in Settings → Environments,
          each with its own PP_CLIENT_ID, PP_CLIENT_SECRET, PP_TENANT_ID,
          PP_TENANT_DOMAIN, and AZURE_CREDENTIALS secrets.
        required: false
        default: 'production'
        type: string
      tenant_label:
        description: 'Optional display label override (e.g. "Contoso"). Falls back to PP_TENANT_DOMAIN secret.'
        required: false
        default: ''
        type: string

permissions:
  contents: write           # Required to commit and push the generated report
  pages: write              # Required to deploy to GitHub Pages
  id-token: write           # Required for OIDC token used by GitHub Pages deploy

jobs:
  generate-report:
    name: Generate Inventory Report
    runs-on: ubuntu-latest
    # Each GitHub Environment holds tenant-specific secrets.
    # To target a different tenant, create a new Environment in
    # Settings → Environments with its own credential secrets,
    # then pass its name via the target_environment input.
    environment: ${{ inputs.target_environment || 'production' }}

    env:
      REPORT_DATE: ''
      REPORT_TIME: ''
      REPORT_DIR: ''

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Set timestamp variables ───────────────────────────────────────────
      - name: Set report timestamp
        run: |
          echo "REPORT_DATE=$(date -u '+%Y%m%d')" >> $GITHUB_ENV
          echo "REPORT_TIME=$(date -u '+%H%M')"   >> $GITHUB_ENV
          echo "REPORT_DIR=reports/$(date -u '+%Y%m%d')/$(date -u '+%H%M')" >> $GITHUB_ENV

      # ── 3. Azure CLI login (service principal) ───────────────────────────────
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          # Secret format (store as AZURE_CREDENTIALS in repo secrets):
          # {
          #   "clientId":       "<app-id>",
          #   "clientSecret":   "<client-secret>",
          #   "subscriptionId": "<subscription-id>",
          #   "tenantId":       "<tenant-id>"
          # }

      # ── 4. Install Power Platform CLI ────────────────────────────────────────
      - name: Install pac CLI
        run: |
          curl -sSL https://aka.ms/PowerAppsCLI/linux -o pac.tar.gz
          mkdir -p $HOME/.pac
          tar -xzf pac.tar.gz -C $HOME/.pac
          echo "$HOME/.pac" >> $GITHUB_PATH

      # ── 5. Authenticate pac to Power Platform ─────────────────────────────────
      - name: Authenticate pac CLI
        run: |
          pac auth create \
            --applicationId "${{ secrets.PP_CLIENT_ID }}" \
            --clientSecret  "${{ secrets.PP_CLIENT_SECRET }}" \
            --tenant        "${{ secrets.PP_TENANT_ID }}" \
            --name          "ci-auth"
          pac auth select --name "ci-auth"

      # ── 6. Collect tenant governance data ────────────────────────────────────
      - name: Collect tenant settings
        run: |
          mkdir -p /tmp/pp-data
          pac admin list-tenant-settings \
            --output json > /tmp/pp-data/tenant-settings.json

      - name: List DLP policies
        run: |
          pac admin dlp-policy list \
            --output json > /tmp/pp-data/dlp-policies.json

      - name: Collect DLP policy details
        run: |
          # Iterate over each policy GUID and fetch its full details
          POLICY_IDS=$(jq -r '.[].policyName // .[].name // empty' /tmp/pp-data/dlp-policies.json 2>/dev/null || echo "")
          mkdir -p /tmp/pp-data/dlp-details
          for ID in $POLICY_IDS; do
            pac admin dlp-policy show --policy-name "$ID" --output json \
              > /tmp/pp-data/dlp-details/${ID}.json || true
          done

      - name: List environments
        run: |
          pac admin list --output json > /tmp/pp-data/environments.json

      - name: Collect environment settings
        run: |
          mkdir -p /tmp/pp-data/env-settings
          ENV_IDS=$(jq -r '.[].environmentId // .[].EnvironmentId // empty' \
            /tmp/pp-data/environments.json 2>/dev/null || echo "")
          for ENV_ID in $ENV_IDS; do
            pac env list-settings --environment "$ENV_ID" --output json \
              > /tmp/pp-data/env-settings/${ENV_ID}.json || true
          done

      # ── 7. Query Power Platform inventory via Azure Resource Graph ────────────
      - name: Query Power Platform inventory
        run: |
          PP_API=$(az rest \
            --method GET \
            --url "https://management.azure.com/providers/Microsoft.PowerPlatform?api-version=2020-10-01" \
            --query "namespace" -o tsv 2>/dev/null || echo "https://api.powerplatform.com")

          az rest \
            --method POST \
            --url "https://api.powerplatform.com/resourcequery/resources/query?api-version=2024-10-01" \
            --headers "Content-Type=application/json" \
            --body '{
              "TableName": "PowerPlatformResources",
              "Clauses": [
                {
                  "$type": "where",
                  "FieldName": "type",
                  "Operator": "in~",
                  "Values": [
                    "'\''microsoft.powerapps/canvasapps'\''",
                    "'\''microsoft.flow/flows'\''",
                    "'\''microsoft.copilotstudio/agents'\''",
                    "'\''microsoft.powerplatform/environments'\''",
                    "'\''microsoft.powerapps/modeldrivenapps'\''"
                  ]
                }
              ],
              "Options": { "Top": 1000, "Skip": 0 }
            }' \
            > /tmp/pp-data/inventory.json || echo '{"value":[]}' > /tmp/pp-data/inventory.json

      # ── 8. Install Node.js for report generation ──────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 9. Generate the HTML report ───────────────────────────────────────────
      - name: Generate HTML report
        env:
          PP_TENANT_ID:     ${{ secrets.PP_TENANT_ID }}
          PP_TENANT_DOMAIN: ${{ secrets.PP_TENANT_DOMAIN || inputs.tenant_label }}
        run: |
          mkdir -p "${{ env.REPORT_DIR }}"
          node scripts/generate-report.mjs \
            --data-dir /tmp/pp-data \
            --output    "${{ env.REPORT_DIR }}/inventory-report.html" \
            --date      "${{ env.REPORT_DATE }}" \
            --time      "${{ env.REPORT_TIME }}"

      # ── 10. Publish to GitHub Pages (docs/index.html) ────────────────────────
      - name: Publish to GitHub Pages
        run: |
          mkdir -p docs
          cp "${{ env.REPORT_DIR }}/inventory-report.html" docs/index.html

      # ── 11. Commit and push the report + Pages update ─────────────────────────
      - name: Commit and push report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.REPORT_DIR }}" docs/index.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: daily inventory report ${{ env.REPORT_DATE }}-${{ env.REPORT_TIME }}"
          git push

      # ── 12. Upload to Azure Blob Storage (permanent versioned history) ────────
      # One-time setup — run these commands once per tenant to create the
      # storage account and enable static website hosting:
      #
      #   az group create --name rg-pp-inventory --location southindia
      #   az storage account create \
      #     --name ppinventory<UNIQUE_SUFFIX> \
      #     --resource-group rg-pp-inventory \
      #     --sku Standard_LRS \
      #     --allow-blob-public-access true
      #   az storage blob service-properties update \
      #     --account-name ppinventory<UNIQUE_SUFFIX> \
      #     --static-website \
      #     --index-document index.html \
      #     --404-document index.html
      #
      # Then add STORAGE_ACCOUNT_NAME = ppinventory<UNIQUE_SUFFIX>
      # as a secret in the GitHub Environment for this tenant.
      #
      # After setup, reports are permanently accessible at:
      #   Latest:    https://<account>.z13.web.core.windows.net/
      #   Versioned: https://<account>.z13.web.core.windows.net/reports/YYYYMMDD/HHmm/inventory-report.html
      - name: Upload report to Azure Blob Storage
        if: ${{ secrets.STORAGE_ACCOUNT_NAME != '' }}
        env:
          STORAGE_ACCOUNT: ${{ secrets.STORAGE_ACCOUNT_NAME }}
        run: |
          if [ -z "$STORAGE_ACCOUNT" ]; then
            echo "⚠️  STORAGE_ACCOUNT_NAME secret not set — skipping blob upload."
            echo "    See workflow comments for one-time setup instructions."
            exit 0
          fi

          # Upload versioned copy: reports/YYYYMMDD/HHmm/inventory-report.html
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "\$web" \
            --name "reports/${{ env.REPORT_DATE }}/${{ env.REPORT_TIME }}/inventory-report.html" \
            --file  "${{ env.REPORT_DIR }}/inventory-report.html" \
            --content-type "text/html" \
            --overwrite \
            --auth-mode login

          # Upload as index.html (always the latest report)
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "\$web" \
            --name "index.html" \
            --file  "${{ env.REPORT_DIR }}/inventory-report.html" \
            --content-type "text/html" \
            --overwrite \
            --auth-mode login

          STATIC_URL=$(az storage account show \
            --name "$STORAGE_ACCOUNT" \
            --query "primaryEndpoints.web" -o tsv)
          echo "✅ Report published:"
          echo "   Latest:    ${STATIC_URL}"
          echo "   Versioned: ${STATIC_URL}reports/${{ env.REPORT_DATE }}/${{ env.REPORT_TIME }}/inventory-report.html"

      # ── 13. Upload report as Actions artifact (30-day backup) ────────────────
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory-report-${{ env.REPORT_DATE }}-${{ env.REPORT_TIME }}
          path: ${{ env.REPORT_DIR }}/inventory-report.html
          retention-days: 90
