name: Deploy Power Platform Solutions

on:
  workflow_dispatch:
    inputs:
      source_environment:
        description: 'Source Environment'
        required: true
        default: 'ecellorsdev'
        type: choice
        options:
          - ecellorsdev
          - New Features Environment
      target_environment:
        description: 'Target Environment'
        required: true
        type: choice
        options:
          - New Features Environment
          - ecellorsnewfeatures
          
      solution_name:
        description: 'Solution Name (leave empty for all)'
        required: false
        default: ''
      deployment_mode:
        description: 'Deployment Mode'
        required: true
        default: 'upgrade'
        type: choice
        options:
          - upgrade
          - update
  
  # Auto-deploy on merge to production branch
  push:
    branches:
      - main
    paths:
      - 'solutions/**'
      - '.github/workflows/deploy-solutions.yml'

jobs:
  deploy-solutions:
    runs-on: windows-latest
    name: Deploy Solutions to Target Environment
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Display Environment Configuration
        run: |
          Write-Host "=== Deployment Configuration ===" -ForegroundColor Cyan
          Write-Host "Source Environment: ${{ github.event.inputs.source_environment || 'ecellorsdev' }}"
          Write-Host "Target Environment: ${{ github.event.inputs.target_environment }}"
          Write-Host "Solution Name: ${{ github.event.inputs.solution_name || 'All solutions' }}"
          Write-Host "Deployment Mode: ${{ github.event.inputs.deployment_mode || 'upgrade' }}"
          Write-Host "Trigger: ${{ github.event_name }}"
          Write-Host "Branch: ${{ github.ref_name }}"
          Write-Host "Actor: ${{ github.actor }}"
        shell: pwsh

      - name: Load Environment URLs
        id: load-envs
        run: |
          $envConfig = Get-Content -Path "./config/environments.json" | ConvertFrom-Json
          
          $sourceEnv = "${{ github.event.inputs.source_environment || 'ecellorsdev' }}"
          $targetEnv = "${{ github.event.inputs.target_environment }}"
          
          $sourceUrl = $envConfig.environments | Where-Object { $_.name -eq $sourceEnv } | Select-Object -ExpandProperty url
          $targetUrl = $envConfig.environments | Where-Object { $_.name -eq $targetEnv } | Select-Object -ExpandProperty url
          
          if (-not $sourceUrl) {
            Write-Host "::error::Source environment '$sourceEnv' not found in config"
            exit 1
          }
          
          if (-not $targetUrl) {
            Write-Host "::error::Target environment '$targetEnv' not found in config"
            exit 1
          }
          
          Write-Host "SOURCE_URL=$sourceUrl" >> $env:GITHUB_OUTPUT
          Write-Host "TARGET_URL=$targetUrl" >> $env:GITHUB_OUTPUT
          
          Write-Host "✓ Source URL: $sourceUrl" -ForegroundColor Green
          Write-Host "✓ Target URL: $targetUrl" -ForegroundColor Green
        shell: pwsh

      - name: Who Am I (Source Environment)
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ steps.load-envs.outputs.SOURCE_URL }}
          app-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          tenant-id: ${{ secrets.TENANT_ID }}

      - name: Export Solution from Source
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ steps.load-envs.outputs.SOURCE_URL }}
          app-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          tenant-id: ${{ secrets.TENANT_ID }}
          solution-name: ${{ github.event.inputs.solution_name }}
          solution-output-file: 'solution.zip'
          managed: true
          run-asynchronously: false

      - name: Who Am I (Target Environment)
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ steps.load-envs.outputs.TARGET_URL }}
          app-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          tenant-id: ${{ secrets.TENANT_ID }}

      - name: Import Solution to Target
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ steps.load-envs.outputs.TARGET_URL }}
          app-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          tenant-id: ${{ secrets.TENANT_ID }}
          solution-file: 'solution.zip'
          force-overwrite: true
          publish-changes: true
          skip-dependency-check: false
          convert-to-managed: true
          run-asynchronously: false
          use-deployment-settings-file: false

      - name: Publish All Customizations
        uses: microsoft/powerplatform-actions/publish-solution@v1
        with:
          environment-url: ${{ steps.load-envs.outputs.TARGET_URL }}
          app-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          tenant-id: ${{ secrets.TENANT_ID }}

      - name: Upload Solution Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exported-solution-${{ github.event.inputs.solution_name || 'all' }}-${{ github.run_number }}
          path: solution.zip
          retention-days: 30

      - name: Deployment Summary
        if: always()
        run: |
          $status = "${{ job.status }}"
          if ($status -eq 'success') {
            Write-Host "`n✅ DEPLOYMENT SUCCESSFUL" -ForegroundColor Green
            Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" -ForegroundColor Green
          } else {
            Write-Host "`n❌ DEPLOYMENT FAILED" -ForegroundColor Red
            Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" -ForegroundColor Red
          }
          
          Write-Host "Solution: ${{ github.event.inputs.solution_name || 'All' }}"
          Write-Host "Source: ${{ github.event.inputs.source_environment || 'ecellorsdev' }}"
          Write-Host "Target: ${{ github.event.inputs.target_environment }}"
          Write-Host "Mode: ${{ github.event.inputs.deployment_mode || 'upgrade' }}"
          Write-Host "Triggered by: ${{ github.actor }}"
          Write-Host "Run: #${{ github.run_number }}"
        shell: pwsh

      - name: Send Deployment Notification
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅ Success' : '❌ Failed';
            const deployment = {
              status: status,
              solution: '${{ github.event.inputs.solution_name || 'All' }}',
              source: '${{ github.event.inputs.source_environment || 'ecellorsdev' }}',
              target: '${{ github.event.inputs.target_environment }}',
              mode: '${{ github.event.inputs.deployment_mode || 'upgrade' }}',
              branch: '${{ github.ref_name }}',
              actor: '${{ github.actor }}',
              run_number: '${{ github.run_number }}',
              timestamp: new Date().toISOString()
            };
            
            core.notice(`${status}: Deployed from ${deployment.source} to ${deployment.target}`);
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            console.log(`Deployment ${status}`);
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            console.log(JSON.stringify(deployment, null, 2));
